name: Deploy GitHub Pages

on:
  push:
    branches: [main]
  schedule:
    - cron: "17 3 * * *"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: github-pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    outputs:
      changed: ${{ steps.data_changes.outputs.changed }}
      should_deploy: ${{ steps.data_changes.outputs.should_deploy }}
    steps:
      - name: Repository auschecken
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false

      - name: Node.js einrichten
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 22
          cache: npm

      - name: Abhängigkeiten installieren
        run: npm ci

      - name: Öffentliche Wochenmenüs aktualisieren
        run: npm run refresh:menus

      - name: Fehlende Rezeptdetails aktualisieren
        run: npm run refresh:recipes

      - name: Bestehenden Produktions-Build erstellen
        run: npm run build

      - name: Bestehende Regressionstests ausführen
        run: npm run test:sites

      - name: GitHub-Pages-Build erstellen
        run: npm run build:pages

      - name: GitHub-Pages-Build prüfen
        run: npm run test:pages

      - name: Sichere Datenübergabe prüfen
        run: python3 -m unittest discover -s tests -p test_data_handoff.py -v

      - name: Datenänderungen prüfen
        id: data_changes
        run: python3 ci/data_handoff.py package "$RUNNER_TEMP/data-handoff/changes.json"

      - name: Validierte Daten kurzzeitig übergeben
        if: steps.data_changes.outputs.changed == 'true'
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: validated-menu-data
          path: ${{ runner.temp }}/data-handoff/changes.json
          if-no-files-found: error
          retention-days: 1
          compression-level: 9

      - name: Statisches Build-Artefakt hochladen
        if: steps.data_changes.outputs.should_deploy == 'true'
        uses: actions/upload-pages-artifact@56afc609e74202658d3ffba0e8f6dda462b719fa # v3
        with:
          path: dist/client

  save-data:
    if: needs.build.outputs.changed == 'true'
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Geprüften Quellstand auschecken
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: ${{ github.sha }}
          # Only this job writes data. It never installs or runs app dependencies.
          persist-credentials: true

      - name: Daten desselben Workflow-Laufs herunterladen
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: validated-menu-data
          path: ${{ runner.temp }}/data-handoff

      - name: Ausschließlich erlaubte JSON-Daten übernehmen
        run: python3 ci/data_handoff.py apply "$RUNNER_TEMP/data-handoff/changes.json"

      - name: Validierte Datenänderungen speichern
        env:
          TARGET_REF: ${{ github.ref }}
        run: |
          [[ "$TARGET_REF" == refs/heads/* ]]
          git diff --cached --check
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git -c core.hooksPath=/dev/null commit -m "chore(data): refresh HelloFresh weekly snapshots"
          # A concurrent main update must fail rather than overwrite another task.
          git push origin "HEAD:$TARGET_REF"

  deploy:
    if: ${{ always() && needs.build.result == 'success' && needs.build.outputs.should_deploy == 'true' && (needs.save-data.result == 'success' || needs.save-data.result == 'skipped') }}
    needs: [build, save-data]
    permissions:
      contents: read
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: GitHub Pages konfigurieren
        uses: actions/configure-pages@983d7736d9b0ae728b81ab479565c72886d7745b # v5

      - name: GitHub Pages veröffentlichen
        id: deployment
        uses: actions/deploy-pages@d6db90164ac5ed86f2b6aed7e0febac5b3c0c03e # v4

  refresh-health:
    if: ${{ always() && github.event_name == 'schedule' }}
    needs: [build, deploy]
    permissions:
      issues: write
    runs-on: ubuntu-latest
    steps:
      - name: Wiederholte Aktualisierungsfehler melden
        uses: actions/github-script@f28e40c7f34bde8b3046d885e986cb6290c5673b # v7
        with:
          script: |
            const title = "KochKlar: automatische Wochenaktualisierung fehlgeschlagen";
            const buildResult = "${{ needs.build.result }}";
            const deployResult = "${{ needs.deploy.result }}";
            const expectedDeploy = ${{ needs.build.outputs.should_deploy == 'true' }};
            const failed = buildResult !== "success" || (expectedDeploy && deployResult !== "success");
            const { data: issues } = await github.rest.issues.listForRepo({
              owner: context.repo.owner,
              repo: context.repo.repo,
              state: "open",
              per_page: 100,
            });
            const existing = issues.find((issue) => !issue.pull_request && issue.title === title);
            const runUrl = `${context.serverUrl}/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}`;

            if (failed) {
              const body = `Der tägliche Aktualisierungslauf ist fehlgeschlagen. Build: ${buildResult}; Deployment: ${deployResult}. Lauf: ${runUrl}`;
              if (existing) {
                await github.rest.issues.createComment({
                  owner: context.repo.owner,
                  repo: context.repo.repo,
                  issue_number: existing.number,
                  body,
                });
              } else {
                await github.rest.issues.create({
                  owner: context.repo.owner,
                  repo: context.repo.repo,
                  title,
                  body,
                });
              }
            } else if (existing) {
              await github.rest.issues.createComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: existing.number,
                body: `Die tägliche Aktualisierung ist wieder erfolgreich. Lauf: ${runUrl}`,
              });
              await github.rest.issues.update({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: existing.number,
                state: "closed",
                state_reason: "completed",
              });
            }
