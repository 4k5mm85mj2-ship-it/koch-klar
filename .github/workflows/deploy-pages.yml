name: Deploy GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: github-pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Repository auschecken
        uses: actions/checkout@v4

      - name: Node.js einrichten
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Abhängigkeiten installieren
        run: npm ci

      - name: Bestehenden Produktions-Build erstellen
        run: npm run build

      - name: Bestehende Regressionstests ausführen
        run: npm run test:sites

      - name: GitHub-Pages-Build erstellen
        run: npm run build:pages

      - name: GitHub-Pages-Build prüfen
        run: npm run test:pages

      - name: GitHub Pages konfigurieren
        uses: actions/configure-pages@v5

      - name: Statisches Build-Artefakt hochladen
        uses: actions/upload-pages-artifact@v3
        with:
          path: dist/client

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: GitHub Pages veröffentlichen
        id: deployment
        uses: actions/deploy-pages@v4
